 <html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-[#F4F5F7] min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl shadow-xl p-8 max-w-sm w-full text-center flex flex-col items-center border border-gray-100/50">
        
        <div class="w-24 h-24 rounded-full bg-[#528A6D] flex items-center justify-center text-white text-4xl font-semibold shadow-inner mb-6">
            R
        </div>

        <h1 class="text-2xl font-bold text-gray-900 mb-1">Yanamala Sudha</h1>
        <p class="text-sm font-medium text-gray-500 mb-6">Frontend Developer</p>

        <p class="text-sm text-gray-600 leading-relaxed mb-6 px-2">
            I build clean, accessible interfaces and enjoy turning ideas into working code.
        </p>

        <div class="flex flex-wrap justify-center gap-2 mb-8">
            <span class="px-4 py-1.5 bg-[#E6ECE8] text-[#345E49] text-xs font-semibold rounded-full">
                HTML
            </span>
            <span class="px-4 py-1.5 bg-[#E6ECE8] text-[#345E49] text-xs font-semibold rounded-full">
                CSS
            </span>
            <span class="px-4 py-1.5 bg-[#E6ECE8] text-[#345E49] text-xs font-semibold rounded-full">
                JavaScript
            </span>
        </div>

        <button onclick="handleContactClick()" class="w-full py-3 px-6 bg-[#3C7356] hover:bg-[#345E49] active:scale-[0.98] transition-all duration-200 text-white font-medium rounded-xl shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-[#3C7356] focus:ring-offset-2">
            Contact Me
        </button>

    </div>

    <script>
        function handleContactClick() {
            // Simple interactive action without alert()
            const btn = document.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = 'Redirecting...';
            btn.classList.add('opacity-80');
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.remove('opacity-80');
            }, 1000);
        }
    </script>
</body>
</html>
